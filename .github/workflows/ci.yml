name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  fallback:
    name: Analyzer without optional parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tree-sitter grammars are optional and the analyzer must still work on regexes
      # alone. Only those two packages are removed: `npm ci --omit=optional` would also
      # strip the native bindings that vitest and vite need to run at all.
      - name: Remove the optional grammars
        run: rm -rf node_modules/web-tree-sitter node_modules/tree-sitter-wasms
      - run: npm test

  desktop:
    name: Desktop shell smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:compile
      # Launches the real Electron shell, which reports whether the preload bridge answered,
      # the embedded analyzer served /api/health, the UI rendered and a junk licence key was
      # rejected. Compiling proves none of that.
      - name: Launch and self-report
        run: xvfb-run -a npx electron dist-electron/desktop/main.js --no-sandbox --smoke --smoke-shot=desktop-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: desktop-smoke.png
          if-no-files-found: ignore
