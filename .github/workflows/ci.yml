name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  fallback:
    name: Analyzer without optional parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tree-sitter grammars are optional: the analyzer must still work on regexes alone.
      - run: npm ci --omit=optional
      - run: npm test
